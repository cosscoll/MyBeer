name: MyBeer — quality gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          node --check js/beer-visual.js
          node --check js/experience.js
          node --check js/ui.js
          node --check js/beer-styles-data.js
          node --check tests/smoke.cjs
      - name: Install DOM test environment
        run: npm install --no-save --no-package-lock --ignore-scripts jsdom@26
      - name: Run full 9-step smoke test
        run: node tests/smoke.cjs
