name: MyBeer — quality gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          node --check js/beer-visual.js
          node --check js/experience.js
          node --check js/ui.js
          node --check js/beer-styles-data.js
          node --check tests/smoke.cjs
          node --check tests/browser.cjs
      - name: Install DOM test environment
        run: npm install --no-save --no-package-lock --ignore-scripts jsdom@26 playwright@1.56.1
      - name: Run full 9-step smoke test
        run: node tests/smoke.cjs
      - name: Test real desktop and mobile browsers
        run: node tests/browser.cjs
      - name: Keep screenshots for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mybeer-previews
          path: artifacts/*.png
          if-no-files-found: ignore

  live:
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify public GitHub Pages HTTP deployment
        shell: bash
        run: |
          URL="https://cosscoll.github.io/MyBeer/"
          for attempt in $(seq 1 24); do
            HTML=$(curl -fsSL --max-time 8 "$URL?version=$GITHUB_SHA" || true)
            STYLE=$(curl -fsSL --max-time 8 "${URL}css/experience.css?version=$GITHUB_SHA" || true)
            JS=$(curl -fsSL --max-time 8 "${URL}js/experience.js?version=$GITHUB_SHA" || true)
            if [[ "$HTML" == *'beer-inside-bubbles'* ]] && [[ "$STYLE" == *'translate(-50%,-46%) scale(.67)'* ]] && [[ "$JS" == *'BrewExperience'* ]]; then
              echo "PASS: public HTML, current CSS and interactive JS accessible"
              exit 0
            fi
            echo "Waiting for GitHub Pages (attempt $attempt/24)"
            sleep 5
          done
          echo "::error::Public site has not received latest MyBeer experience"
          exit 1
